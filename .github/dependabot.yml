# The actions in validate-app-manifests.yaml are pinned to full commit SHAs
# rather than tags, because a tag is a mutable pointer its owner can move —
# which is how tj-actions/changed-files leaked secrets from thousands of
# repositories in March 2025. See dlouwers/experiments#301.
#
# This file is what keeps that from becoming slow rot. Dependabot's
# github-actions ecosystem understands SHA pins and rewrites the SHA and the
# trailing version comment together; without it, a SHA pin is a pin that never
# moves again. `directory: "/"` is correct and is not a stand-in for
# "/.github/workflows": the ecosystem is anchored at the repository root and
# locates the workflow directory itself. Pointing it at the literal workflow
# path is the classic way to end up with a config Dependabot accepts and then
# never opens a single PR from.
#
# NOT covered: the tool versions in the workflow's `env:` block
# (KUSTOMIZE_VERSION, KUBECONFORM_VERSION, PROMTOOL_VERSION, HELM_VERSION).
# Dependabot parses `uses:` references and nothing else, and those are curl'd
# release tarballs and a `with: version:` string. Bump them by hand.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(actions)"
    labels:
      - "dependencies"
